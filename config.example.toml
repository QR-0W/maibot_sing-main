# 示例仅展示无凭证配置；插件默认禁用，启用须经维护者审查。
[plugin]
enabled = false
config_version = "0.6.0"

[local]
backend = "local"
# 留空使用 SDK 的 ctx.paths.data_dir/covers；覆盖值必须为绝对路径。
output_dir = ""
# 管理员按本机实际安装填写，留空会拒绝启动本地翻唱后端；不捆绑权重、许可证或隔离环境。
model_path = ""
index_path = ""
# 所有渲染输入必须显式指定；不从开发机路径或缓存隐式回退。
hubert_path = ""
# 必须为包含 htdemucs.yaml 与本地签名 .th 的专用目录，不读默认缓存。
demucs_repo_path = ""
rvc_upstream_path = ""
worker_python = ""
musicdl_python = ""
rvc_script = ""
inference_lock = ""
max_queue = 2
timeout_s = 900
max_duration_s = 300
max_download_bytes = 67108864
# 仅供维护者受控回归；普通歌曲请求不接受本地路径。
local_source_allowlist = []
# 媒体阶段及其所有子进程共享独立 systemd user 服务预算；OOM 终止整个服务。
# 单位是 MiB；MemoryHigh 自动取75%，swap=0。不保证其它服务不会耗尽容器。
# 启动前及服务内取得共享锁后检查真实祖先 cgroup 余量，不从 MemTotal 猜容量。
memory_max_mb = 2048
# 启动任何阶段前要求保留的宿主空闲内存；不足直接返回 resource_budget_exhausted，不启动。
memory_headroom_mb = 512
cpu_quota_percent = 150
media_tasks_max = 64

[rvc]
# 历史 sidecar 兼容字段；本地后端不启动旧 sidecar。
auto_start = false
# 仅供旧功能兼容；说话时应关闭后处理，否则当前实现会明确报错。

[mimo]
api_key = ""
api_base_url = "https://api.xiaomimimo.com/v1"
voice_mode = "preset"
preset_voice = "mimo_default"
reference_audio = ""
rvc_after_tts = false

[music]
default_platform = "163"
search_limit = 5
netease_account = ""
netease_password = ""
netease_countrycode = "86"
netease_music_u = ""
netease_csrf = ""
qq_uin = ""
qq_key = ""

[components]
command_enabled = true
tool_enabled = true
